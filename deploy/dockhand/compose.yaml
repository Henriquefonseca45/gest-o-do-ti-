name: glpi

services:
  glpi:
    image: glpi/glpi:${GLPI_VERSION:-12.0}
    restart: unless-stopped
    ports:
      - "${GLPI_HTTP_PORT:-8085}:80"
    environment:
      GLPI_DB_HOST: db
      GLPI_DB_PORT: 3306
      GLPI_DB_NAME: ${GLPI_DB_NAME:-glpi}
      GLPI_DB_USER: ${GLPI_DB_USER:-glpi}
      GLPI_DB_PASSWORD: ${GLPI_DB_PASSWORD:?Defina GLPI_DB_PASSWORD no Dockhand}
      GLPI_CRONTAB_ENABLED: "1"
      GLPI_SKIP_AUTOINSTALL: "false"
      GLPI_SKIP_AUTOUPDATE: "false"
    volumes:
      - glpi_data:/var/glpi
    depends_on:
      db:
        condition: service_healthy
      theme:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost/pics/logos/logo-GLPI-100-white.png
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  theme:
    image: gestao-ti-rvb-theme:1
    build:
      context: .
    pull_policy: build
    restart: "no"
    volumes:
      - glpi_data:/var/glpi

  configure:
    image: mariadb:${MARIADB_VERSION:-11.8}
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Defina MARIADB_ROOT_PASSWORD no Dockhand}
      GLPI_DB_NAME: ${GLPI_DB_NAME:-glpi}
    depends_on:
      glpi:
        condition: service_healthy
      db:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        mariadb -h db -u root -p"$$MARIADB_ROOT_PASSWORD" "$$GLPI_DB_NAME" -e "
          INSERT INTO glpi_configs (context, name, value)
          VALUES ('core', 'language', 'pt_BR')
          ON DUPLICATE KEY UPDATE value = 'pt_BR';
          INSERT INTO glpi_configs (context, name, value)
          VALUES ('core', 'palette', 'rvb')
          ON DUPLICATE KEY UPDATE value = 'rvb';
          UPDATE glpi_users
          SET language = 'pt_BR', palette = 'rvb'
          WHERE is_deleted = 0;
        "

  db:
    image: mariadb:${MARIADB_VERSION:-11.8}
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Defina MARIADB_ROOT_PASSWORD no Dockhand}
      MARIADB_DATABASE: ${GLPI_DB_NAME:-glpi}
      MARIADB_USER: ${GLPI_DB_USER:-glpi}
      MARIADB_PASSWORD: ${GLPI_DB_PASSWORD:?Defina GLPI_DB_PASSWORD no Dockhand}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mariadb-admin ping -h 127.0.0.1 -u root -p"$$MARIADB_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  glpi_data:
  db_data:
